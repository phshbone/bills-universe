<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c3440"><title>Billodex editor proof</title><style>:root{--burg:#6c3440;--burg2:#4f2730;--paper:#d5d0c8;--paper2:#e4e0d9;--ink:#292625;--muted:#726b68;--line:#b7afa7;--shadow:0 8px 24px #0002}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#bdb7b0;color:var(--ink)}button,input,select{font:inherit}.app{min-height:100dvh;background:var(--paper);background-image:repeating-linear-gradient(12deg,#ffffff10 0 1px,transparent 1px 5px),repeating-linear-gradient(98deg,#00000008 0 1px,transparent 1px 7px)}header{position:sticky;top:0;z-index:5;background:linear-gradient(#72404a,#62313b);color:#fff;padding:14px 16px 10px;box-shadow:0 2px 10px #0002}.brand{font-weight:800;letter-spacing:.04em;font-size:21px}.search{margin-top:10px;width:100%;border:0;border-radius:12px;padding:11px 13px;background:#f5f2ed;color:var(--ink)}main{padding:14px 14px 92px;max-width:780px;margin:auto}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#e7e2db}.seg button{border:0;background:transparent;padding:8px 10px}.seg .active{background:var(--burg);color:#fff}.section{margin:18px 0}.section h2{font-size:13px;letter-spacing:.08em;color:var(--burg2);margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.row{background:#e8e3dc;border:1px solid #bcb4ac;border-radius:14px;padding:12px;box-shadow:var(--shadow);cursor:pointer}.card h3,.row h3{margin:0 0 6px;font-size:16px}.preview{color:#504b48;font-size:13px;line-height:1.35;max-height:3.9em;overflow:hidden}.meta{margin-top:9px;color:var(--muted);font-size:11px}.list .grid{display:block}.list .card{margin-bottom:8px;border-radius:10px;box-shadow:none}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#5a2b35;color:#fff;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:4px}.bottom button{border:0;background:transparent;color:#f6ecee;font-size:11px;padding:8px 2px}.bottom .plus{width:56px;height:56px;border-radius:50%;background:#f1e9e4;color:var(--burg2);font-size:30px;line-height:1;margin:-22px auto 0;box-shadow:0 5px 18px #0005}.empty{padding:30px;text-align:center;color:var(--muted)}.sheet{position:fixed;inset:0;z-index:20;background:#0006;display:none;align-items:flex-end}.sheet.show{display:flex}.sheetbox{width:100%;background:#eee9e2;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}.sheetbox h3{margin-top:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button,.primary,.ghost{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8f4ef}.primary{background:var(--burg);color:#fff;border-color:var(--burg)}.ghost{background:transparent}.editor{display:none;min-height:100dvh;background:var(--paper2);background-image:repeating-linear-gradient(15deg,#ffffff18 0 1px,transparent 1px 5px),repeating-linear-gradient(101deg,#00000009 0 1px,transparent 1px 8px)}.editor.show{display:block}.home.hide{display:none}.edithead{position:sticky;top:0;z-index:6;background:var(--burg);color:#fff;padding:10px 12px}.editheadtop{display:flex;align-items:center;gap:8px}.edithead button{border:0;background:transparent;color:#fff;font-size:18px}.title{flex:1;border:0;background:transparent;color:#fff;font-weight:700;font-size:18px;min-width:0}.title::placeholder{color:#e8cfd5}.saveState{font-size:11px;opacity:.8;min-width:44px;text-align:right}.location{margin-top:6px;width:100%;border:0;border-radius:9px;padding:7px 9px;background:#ffffff18;color:#fff}.location option{color:#111}.paper{max-width:760px;margin:auto;padding:22px 18px 130px;min-height:75dvh}.content{outline:0;min-height:55dvh;font-size:17px;line-height:1.55}.content p{margin:.4em 0}.content h2{margin:1em 0 .35em;color:#3d252b}.content ul,.content ol{padding-left:1.4em}.checkitem{display:flex;align-items:flex-start;gap:8px;margin:6px 0}.checkitem input{margin-top:6px}.checktext{outline:0;flex:1}.formatbar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:8;background:#63313b;border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;box-shadow:0 6px 24px #0004}.formatbar button{border:0;border-radius:9px;background:#81505a;color:#fff;padding:10px 3px;font-weight:700}.formatbar button.on{background:#f2e9e3;color:#532631}.trashbtn{float:right;background:none;border:0;color:var(--burg);font-weight:700}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.bottom{max-width:760px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}}</style></head><body><div class="app home" id="home"><header><div class="brand">billodex <small style="font-size:11px;font-weight:500;opacity:.8">editor proof</small></div><input id="search" class="search" placeholder="Search everything…"></header><main><div class="toolbar"><div id="count" style="font-size:12px;color:var(--muted)"></div><div class="seg"><button id="cardsBtn" class="active">▦</button><button id="listBtn">☰</button></div></div><div id="sections"></div><button class="trashbtn" id="trashView">Recently Deleted</button></main><nav class="bottom"><button data-nav="home">Home</button><button id="searchNav">Search</button><button class="plus" id="plus">+</button><button id="foldersNav">Folders</button><button id="moreNav">More</button></nav></div><section class="editor" id="editor"><div class="edithead"><div class="editheadtop"><button id="back">‹</button><input id="title" class="title" placeholder="Untitled note"><span id="saveState" class="saveState">Saved</span><button id="pinBtn">☆</button><button id="deleteBtn">⋯</button></div><select id="location" class="location"><option value="">Junk Drawer</option><option value="elections">Elections / Unsorted</option><option value="universe">Bill's Universe / Unsorted</option></select></div><div class="paper"><div id="content" class="content" contenteditable="true" spellcheck="true"></div></div><div class="formatbar"><button data-cmd="normal" class="on">Aa</button><button data-cmd="bullet">•</button><button data-cmd="number">1.</button><button data-cmd="check">☑</button><button data-cmd="heading">H</button><button data-cmd="insert">+</button></div></section><div class="sheet" id="sheet"><div class="sheetbox"><h3>Quick capture</h3><div class="actions"><button data-new="note">Note</button><button data-new="checklist">Checklist</button></div><p style="color:var(--muted);font-size:12px">Camera, Scan, Audio and Sketch come in the next build slice.</p><button class="ghost" id="cancelSheet" style="width:100%">Cancel</button></div></div><script>(()=>{const KEY='billodexProofV01',TRASH='billodexProofTrash';let notes=JSON.parse(localStorage.getItem(KEY)||'[]'),trash=JSON.parse(localStorage.getItem(TRASH)||'[]'),current=null,view=localStorage.getItem('billodexView')||'cards',saveTimer;const $=id=>document.getElementById(id);function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function plain(html){const d=document.createElement('div');d.innerHTML=html||'';return d.textContent.trim()}function saveAll(){localStorage.setItem(KEY,JSON.stringify(notes));localStorage.setItem(TRASH,JSON.stringify(trash))}function routeLabel(n){return n.folderId==='elections'?'Elections / Unsorted':n.folderId==='universe'?"Bill's Universe / Unsorted":'Junk Drawer'}function render(){const q=$('search').value.trim().toLowerCase();let list=notes.filter(n=>!q||((n.title+' '+plain(n.html)+' '+routeLabel(n)).toLowerCase().includes(q)));$('count').textContent=list.length+' note'+(list.length===1?'':'s');$('home').classList.toggle('list',view==='list');$('cardsBtn').classList.toggle('active',view==='cards');$('listBtn').classList.toggle('active',view==='list');const pinned=list.filter(n=>n.pinned),unsorted=list.filter(n=>!n.pinned&&n.isUnsorted),recent=list.filter(n=>!n.pinned).sort((a,b)=>b.modifiedAt.localeCompare(a.modifiedAt));const groups=[['UNSORTED',unsorted],['PINNED',pinned],['RECENT',recent]];$('sections').innerHTML=groups.map(([name,arr])=>arr.length?`<section class="section"><h2>${name}${name==='UNSORTED'?' · '+arr.length:''}</h2><div class="grid">${arr.slice(0,name==='RECENT'?8:4).map(n=>`<article class="card" data-id="${n.noteId}"><h3>${esc(n.title||'Untitled')}</h3><div class="preview">${esc(plain(n.html)||'Empty note')}</div><div class="meta">${esc(routeLabel(n))} · ${new Date(n.modifiedAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div></article>`).join('')}</div></section>`:'').join('')||'<div class="empty">No notes yet. Tap + to create one.</div>';$('sections').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openNote(el.dataset.id))}function newNote(kind='note'){const now=new Date().toISOString();const n={noteId:'note_'+Date.now(),title:'',html:kind==='checklist'?'<div class="checkitem"><input type="checkbox"><span class="checktext" contenteditable="true">New item</span></div>':'<p><br></p>',createdAt:now,modifiedAt:now,folderId:null,isUnsorted:true,pinned:false,revision:1};notes.unshift(n);saveAll();openNote(n.noteId);$('sheet').classList.remove('show');setTimeout(()=>{$('content').focus();if(kind==='checklist'){const s=$('content').querySelector('.checktext');if(s){const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}}},50)}function openNote(id){current=notes.find(n=>n.noteId===id);if(!current)return;$('home').classList.add('hide');$('editor').classList.add('show');$('title').value=current.title||'';$('content').innerHTML=current.html||'<p><br></p>';$('location').value=current.folderId||'';$('pinBtn').textContent=current.pinned?'★':'☆';wireChecks();$('content').focus()}function closeNote(){commit();current=null;$('editor').classList.remove('show');$('home').classList.remove('hide');render()}function commit(){if(!current)return;current.title=$('title').value.trim()||plain($('content').innerHTML).split('\n')[0].slice(0,80)||'Untitled';current.html=$('content').innerHTML;current.folderId=$('location').value||null;current.isUnsorted=true;current.modifiedAt=new Date().toISOString();current.revision=(current.revision||0)+1;saveAll();$('saveState').textContent='Saved'}function queueSave(){$('saveState').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(commit,250)}function wireChecks(){$('content').querySelectorAll('.checkitem input').forEach(cb=>cb.onchange=queueSave);$('content').querySelectorAll('.checktext').forEach(sp=>{sp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(!sp.textContent.trim()){const p=document.createElement('p');p.innerHTML='<br>';sp.closest('.checkitem').replaceWith(p);placeCaret(p);queueSave();return}const d=document.createElement('div');d.className='checkitem';d.innerHTML='<input type="checkbox"><span class="checktext" contenteditable="true"><br></span>';sp.closest('.checkitem').after(d);wireChecks();placeCaret(d.querySelector('.checktext'));queueSave()}}})}function placeCaret(el){const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}function cmd(type){$('content').focus();if(type==='normal')document.execCommand('formatBlock',false,'p');if(type==='bullet')document.execCommand('insertUnorderedList');if(type==='number')document.execCommand('insertOrderedList');if(type==='heading')document.execCommand('formatBlock',false,'h2');if(type==='check'){const sel=getSelection();let text=sel&&sel.toString().trim();if(text){const lines=text.split(/\n+/).filter(Boolean);document.execCommand('insertHTML',false,lines.map(x=>`<div class="checkitem"><input type="checkbox"><span class="checktext" contenteditable="true">${esc(x)}</span></div>`).join(''));wireChecks()}else document.execCommand('insertHTML',false,'<div class="checkitem"><input type="checkbox"><span class="checktext" contenteditable="true">New item</span></div>');wireChecks()}if(type==='insert')alert('Media blocks are intentionally deferred to the next slice.');queueSave()}$('plus').onclick=()=>$('sheet').classList.add('show');$('cancelSheet').onclick=()=>$('sheet').classList.remove('show');document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>newNote(b.dataset.new));$('back').onclick=closeNote;$('content').addEventListener('input',queueSave);$('title').addEventListener('input',queueSave);$('location').onchange=queueSave;$('pinBtn').onclick=()=>{current.pinned=!current.pinned;$('pinBtn').textContent=current.pinned?'★':'☆';queueSave()};$('deleteBtn').onclick=()=>{if(!current)return;if(confirm('Move this note to Recently Deleted?')){trash.unshift({...current,deletedAt:new Date().toISOString()});notes=notes.filter(n=>n.noteId!==current.noteId);saveAll();current=null;$('editor').classList.remove('show');$('home').classList.remove('hide');render()}};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>cmd(b.dataset.cmd));$('cardsBtn').onclick=()=>{view='cards';localStorage.setItem('billodexView',view);render()};$('listBtn').onclick=()=>{view='list';localStorage.setItem('billodexView',view);render()};$('search').oninput=render;$('searchNav').onclick=()=>{$('search').focus();window.scrollTo({top:0,behavior:'smooth'})};$('foldersNav').onclick=()=>alert('Folder browser comes after the editor proof. Routing to sample folders already works inside a note.');$('moreNav').onclick=()=>alert('Appearance, backup, Universe, Trash and settings come in later slices.');$('trashView').onclick=()=>{if(!trash.length){alert('Recently Deleted is empty.');return}const names=trash.map((n,i)=>`${i+1}. ${n.title||'Untitled'}`).join('\n');const pick=prompt('Recently Deleted\n\n'+names+'\n\nEnter a number to restore, or Cancel.');const i=Number(pick)-1;if(i>=0&&trash[i]){const n=trash.splice(i,1)[0];delete n.deletedAt;notes.unshift(n);saveAll();render()}};render()})();</script></body></html>
